name: Petclinic CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw package

  sonarqube:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run SonarQube analysis
        run: >
          ./mvnw sonar:sonar
          -Dsonar.projectKey=spring-petclinic-devops
          -Dsonar.organization=spring-petclinic-devops
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true

  docker-build:
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f Dockerfile.multistage -t spring-petclinic:latest .

      - name: Scan Docker Image With Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: spring-petclinic:latest
          format: table 
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true